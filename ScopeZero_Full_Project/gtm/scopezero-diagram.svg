<svg width="760" height="672" viewBox="0 0 760 672" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="672" fill="#ffffff"/>
<rect x="48" y="36" width="18" height="18" rx="5" fill="#2563eb"/>
<text x="74" y="51" font-size="16" font-weight="500" fill="#18181b">ScopeZero</text>
<text x="48" y="92" font-size="24" font-weight="500" fill="#18181b">How ScopeZero works</text>
<text x="48" y="116" font-size="13" fill="#52525b">Every AI-agent action is bound to a signed, human-approved authority — and provable.</text>
<line x1="48" y1="134" x2="712" y2="134" stroke="#e4e4e7" stroke-width="1"/>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#a1a1aa"/></marker>
</defs>
<g transform="translate(0,150)">
<rect x="270" y="10" width="220" height="46" rx="10" fill="#f8f8f9" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="380" y="38" text-anchor="middle" font-size="14" fill="#27272a">A human signs a scope</text>
<line x1="380" y1="56" x2="380" y2="76" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="256" y="78" width="248" height="58" rx="10" fill="#eef4ff" stroke="#93b4f7" stroke-width="1.5"/>
<text x="380" y="103" text-anchor="middle" font-size="14" font-weight="500" fill="#1d4ed8">Signed authority grant</text>
<text x="380" y="122" text-anchor="middle" font-size="12" fill="#1d4ed8">Ed25519 · time-boxed · least-privilege</text>
<line x1="380" y1="136" x2="380" y2="156" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="270" y="158" width="220" height="46" rx="10" fill="#f8f8f9" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="380" y="186" text-anchor="middle" font-size="14" fill="#27272a">Agent attempts an action</text>
<line x1="380" y1="204" x2="380" y2="224" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="252" y="226" width="256" height="48" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
<text x="380" y="255" text-anchor="middle" font-size="14" font-weight="500" fill="#1d4ed8">ScopeZero checks it first</text>

<line x1="380" y1="274" x2="164" y2="310" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="380" y1="274" x2="380" y2="310" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="380" y1="274" x2="596" y2="310" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="76" y="312" width="176" height="76" rx="10" fill="#effdf4" stroke="#86efac" stroke-width="1.5"/>
<circle cx="164" cy="336" r="4" fill="#16a34a"/>
<text x="164" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#15803d">In scope</text>
<text x="164" y="378" text-anchor="middle" font-size="12" fill="#15803d">runs autonomously</text>

<rect x="292" y="312" width="176" height="76" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<circle cx="380" cy="336" r="4" fill="#dc2626"/>
<text x="380" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#b91c1c">Exceeds authority</text>
<text x="380" y="378" text-anchor="middle" font-size="12" fill="#b91c1c">blocked before it runs</text>

<rect x="508" y="312" width="176" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<circle cx="596" cy="336" r="4" fill="#d97706"/>
<text x="596" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#b45309">Irreversible</text>
<text x="596" y="378" text-anchor="middle" font-size="12" fill="#b45309">needs human co-sign</text>

<line x1="164" y1="388" x2="356" y2="424" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="380" y1="388" x2="380" y2="424" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="596" y1="388" x2="404" y2="424" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="210" y="426" width="340" height="58" rx="10" fill="#eef4ff" stroke="#93b4f7" stroke-width="1.5"/>
<text x="380" y="451" text-anchor="middle" font-size="14" font-weight="500" fill="#1d4ed8">Every decision → tamper-evident receipt</text>
<text x="380" y="470" text-anchor="middle" font-size="12" fill="#1d4ed8">your customer can verify it themselves</text>
</g>
<text x="48" y="656" font-size="12" fill="#a1a1aa">ScopeZero · authorized autonomy for AI agents</text>
</svg>
