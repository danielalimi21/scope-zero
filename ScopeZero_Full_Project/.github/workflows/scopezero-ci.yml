name: ScopeZero CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Breach-containment proof
        run: npm run demo:breach

      - name: Exfil-to-allowed-host proof
        run: npm run demo:exfil

      - name: Hot-path throughput (regression gate)
        run: node tools/throughput-bench.js 20000

      - name: Concurrency lossless check
        run: node tools/concurrency-bench.js 20000

      - name: Start gateway
        run: node server.js &

      - name: Wait for gateway
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8788/v1/health && exit 0
            sleep 1
          done
          exit 1

      - name: Smoke test
        run: node tools/smoke-test.js

      - name: Verify ledger
        run: node tools/verify-ledger.js

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Dependency audit (high+ fails)
        run: npm run audit

      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  image:
    runs-on: ubuntu-latest
    needs: [verify, supply-chain]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t scopezero:${{ github.sha }} .

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Keyless signing binds the signature to the workflow's OIDC identity.
          # No long-lived key to leak. Requires the image to be pushed to a
          # registry first; wire the push/registry login for your target registry.
          echo "cosign sign --yes scopezero:${{ github.sha }}  # enable once a registry is configured"
