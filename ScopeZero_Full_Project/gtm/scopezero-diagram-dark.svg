<svg width="760" height="672" viewBox="0 0 760 672" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="672" fill="#0f1117"/>
<rect x="48" y="36" width="18" height="18" rx="5" fill="#3b82f6"/>
<text x="74" y="51" font-size="16" font-weight="500" fill="#fafafa">ScopeZero</text>
<text x="48" y="92" font-size="24" font-weight="500" fill="#fafafa">How ScopeZero works</text>
<text x="48" y="116" font-size="13" fill="#a1a1aa">Every AI-agent action is bound to a signed, human-approved authority — and provable.</text>
<line x1="48" y1="134" x2="712" y2="134" stroke="#27272a" stroke-width="1"/>
<defs>
<marker id="ard" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#71717a"/></marker>
</defs>
<g transform="translate(0,150)">
<rect x="270" y="10" width="220" height="46" rx="10" fill="#1c1c22" stroke="#3f3f46" stroke-width="1.5"/>
<text x="380" y="38" text-anchor="middle" font-size="14" fill="#e4e4e7">A human signs a scope</text>
<line x1="380" y1="56" x2="380" y2="76" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>

<rect x="256" y="78" width="248" height="58" rx="10" fill="#15233f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="380" y="103" text-anchor="middle" font-size="14" font-weight="500" fill="#93c5fd">Signed authority grant</text>
<text x="380" y="122" text-anchor="middle" font-size="12" fill="#93c5fd">Ed25519 · time-boxed · least-privilege</text>
<line x1="380" y1="136" x2="380" y2="156" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>

<rect x="270" y="158" width="220" height="46" rx="10" fill="#1c1c22" stroke="#3f3f46" stroke-width="1.5"/>
<text x="380" y="186" text-anchor="middle" font-size="14" fill="#e4e4e7">Agent attempts an action</text>
<line x1="380" y1="204" x2="380" y2="224" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>

<rect x="252" y="226" width="256" height="48" rx="10" fill="#15233f" stroke="#3b82f6" stroke-width="2"/>
<text x="380" y="255" text-anchor="middle" font-size="14" font-weight="500" fill="#93c5fd">ScopeZero checks it first</text>

<line x1="380" y1="274" x2="164" y2="310" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>
<line x1="380" y1="274" x2="380" y2="310" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>
<line x1="380" y1="274" x2="596" y2="310" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>

<rect x="76" y="312" width="176" height="76" rx="10" fill="#0f2417" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="164" cy="336" r="4" fill="#22c55e"/>
<text x="164" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#86efac">In scope</text>
<text x="164" y="378" text-anchor="middle" font-size="12" fill="#86efac">runs autonomously</text>

<rect x="292" y="312" width="176" height="76" rx="10" fill="#2a1416" stroke="#dc2626" stroke-width="1.5"/>
<circle cx="380" cy="336" r="4" fill="#ef4444"/>
<text x="380" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#fca5a5">Exceeds authority</text>
<text x="380" y="378" text-anchor="middle" font-size="12" fill="#fca5a5">blocked before it runs</text>

<rect x="508" y="312" width="176" height="76" rx="10" fill="#2a1f0a" stroke="#d97706" stroke-width="1.5"/>
<circle cx="596" cy="336" r="4" fill="#f59e0b"/>
<text x="596" y="360" text-anchor="middle" font-size="14" font-weight="500" fill="#fcd34d">Irreversible</text>
<text x="596" y="378" text-anchor="middle" font-size="12" fill="#fcd34d">needs human co-sign</text>

<line x1="164" y1="388" x2="356" y2="424" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>
<line x1="380" y1="388" x2="380" y2="424" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>
<line x1="596" y1="388" x2="404" y2="424" stroke="#71717a" stroke-width="1.5" marker-end="url(#ard)"/>

<rect x="210" y="426" width="340" height="58" rx="10" fill="#15233f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="380" y="451" text-anchor="middle" font-size="14" font-weight="500" fill="#93c5fd">Every decision → tamper-evident receipt</text>
<text x="380" y="470" text-anchor="middle" font-size="12" fill="#93c5fd">your customer can verify it themselves</text>
</g>
<text x="48" y="656" font-size="12" fill="#71717a">ScopeZero · authorized autonomy for AI agents</text>
</svg>
