apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scopezero-gateway
  namespace: scopezero
spec:
  podSelector:
    matchLabels:
      app: scopezero-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8788
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
